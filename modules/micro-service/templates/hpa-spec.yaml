---
%{ if minReplicas != null }
minReplicas: ${minReplicas}
%{ endif }
%{ if maxReplicas != null }
maxReplicas: ${maxReplicas}
%{ endif }
%{ if metrics != null }
metrics:
%{ for metric in metrics }
- type: ${metric.type}
%{ if metric.type == "Resource" }
  resource: 
    name: ${metric.resource.name}
    target:
      %{ for key, value in metric.resource.target }
      %{ if value != null }
      ${key}: ${value}
      %{ endif ~}
      %{ endfor ~}
%{ endif }
%{ if metric.type == "Pods" }
  pods:
    metric: 
      name: ${metric.pods.metric.name}
    target:
      %{ for key, value in metric.pods.target }
      %{ if value != null }
      ${key}: ${value}
      %{ endif ~}
      %{ endfor ~}
%{ endif }
%{ if metric.type == "Object" }
  object:
    metric: 
      name: ${metric.object.metric.name}
    target:
      %{ for key, value in metric.object.target }
      %{ if value != null }
      ${key}: ${value}
      %{ endif ~}
      %{ endfor ~}
    describedObject:
      apiVersion: ${metric.object.describedObject.apiVersion}
      kind: ${metric.object.describedObject.kind}
      name: ${metric.object.describedObject.name}
%{ endif }
%{ endfor ~}
%{ endif }
%{ if behavior != null }
behavior:
%{ for direction, rules in behavior }
%{ if rules != null }
  ${direction}:
    %{ if rules.stabilizationWindowSeconds != null }
    stabilizationWindowSeconds: ${rules.stabilizationWindowSeconds}
    %{ endif ~}
    %{ if rules.selectPolicy != null }
    selectPolicy: ${rules.selectPolicy}
    %{ endif ~}
    %{ if rules.policies != null }
    policies:
    %{ for policy in rules.policies }
    - type: ${policy.type}
      value: ${policy.value}
      periodSeconds: ${policy.periodSeconds}
    %{ endfor ~}
    %{ endif ~}
%{ endif }
%{ endfor ~}
%{ endif }
